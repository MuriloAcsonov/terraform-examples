version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: comments-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comments
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: comments-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db/comments
    ports:
      - "8000:8000"
